[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "educational-app"
version = "0.1.0"
description = "Feature-based Question Bank application with internal Curriculum RAG"
requires-python = ">=3.11,<3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "chromadb>=0.6,<0.7",
  "fastapi>=0.115",
  "json-repair==0.63.4",
  "numpy>=1.26",
  "openai>=1.0.0",
  "pandas>=2.2",
  "posthog<3.0.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.6",
  "PyMuPDF>=1.26",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "requests>=2.31",
  "sentence-transformers>=3.2",
  "streamlit>=1.40.0",
  "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false
